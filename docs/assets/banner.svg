<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="YoutubeDownloader - Developed by Syed Muhammad Tayyab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f13"/><stop offset="0.55" stop-color="#1c1018"/><stop offset="1" stop-color="#2a0b12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0033"><animate attributeName="stop-color" values="#ff0033;#ff6a00;#ff0033" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff6a00"><animate attributeName="stop-color" values="#ff6a00;#ff0033;#ff6a00" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ff2d4d" stroke-width="1">
    <path d="M0 40H1200M0 100H1200M0 160H1200M0 220H1200M0 280H1200"/>
    <path d="M100 0V320M300 0V320M500 0V320M700 0V320M900 0V320M1100 0V320"/>
  </g>
  <g fill="#ff2d4d" opacity="0.5">
    <circle cx="140" cy="60" r="3"><animate attributeName="cy" values="60;260;60" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="260" r="2.5"><animate attributeName="cy" values="260;40;260" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="50" r="3"><animate attributeName="cy" values="50;270;50" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="250" r="2.5"><animate attributeName="cy" values="250;60;250" dur="10s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(110 92)" filter="url(#glow)">
    <rect width="150" height="106" rx="26" fill="url(#red)"><animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/></rect>
    <path d="M58 28 L58 78 L102 53 Z" fill="#fff"/>
    <g transform="translate(75 118)"><path d="M0 0 L0 0" /></g>
  </g>
  <g transform="translate(135 215)" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 -6 L50 22 M36 10 L50 24 L64 10"><animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <text x="300" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff">Youtube<tspan fill="url(#red)">Downloader</tspan></text>
  <text x="304" y="196" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" fill="#d8d8e0">Cross-platform desktop app to download YouTube videos, playlists &amp; channels</text>
  <rect x="304" y="226" width="470" height="44" rx="22" fill="none" stroke="url(#red)" stroke-width="2.5"/>
  <text x="539" y="255" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Developed by Syed Muhammad Tayyab</text>
  <rect x="0" y="312" width="1200" height="8" fill="url(#red)"><animate attributeName="width" values="0;1200;1200" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/></rect>
</svg>
